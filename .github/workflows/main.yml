name: Test and install package and render pkgdown website

on:
  push:
    branches:
      - main

# upload-pages-artifact requires pages:write on the job that uploads; deploy needs id-token for OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: rocker/r-ver:4.3.2
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            pandoc \
            curl \
            libxml2-dev \
            libssl-dev \
            libcurl4-openssl-dev
          apt-get clean
          rm -rf /var/lib/apt/lists/
          
      - name: Install Package Dependencies
        run: |
          Rscript -e "install.packages('remotes', repos = 'https://cran.rstudio.com/')"
          Rscript -e "remotes::install_deps(dependencies = TRUE, repos = 'https://cran.rstudio.com/')"
          
      - name: Install Package
        run: |
          R CMD INSTALL .
          
      - name: Test Package
        run: |
          Rscript -e "testthat::test_dir(path = 'tests/testthat')"
          
      - name: Render Pkgdown Site
        run: |
          Rscript -e "install.packages('pkgdown', repos = 'https://cran.rstudio.com/')"
          Rscript -e "pkgdown::build_site()"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deployment